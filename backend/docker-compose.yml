services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      args:
        SERVICE_PATH: services/auth
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      MONGO_URI: ${COMPOSE_MONGO_URI:-mongodb://mongodb:27017/commonplace}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat:
    build:
      context: .
      args:
        SERVICE_PATH: services/chat
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-3002}
      MONGO_URI: ${COMPOSE_MONGO_URI:-mongodb://mongodb:27017/commonplace}
    depends_on:
      mongodb:
        condition: service_healthy

  agent:
    build:
      context: .
      args:
        SERVICE_PATH: services/agent
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AGENT_SERVICE_PORT: ${AGENT_SERVICE_PORT:-3003}
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-2-klein-4b}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-}
      PINECONE_HOST: ${PINECONE_HOST:-}
    depends_on:
      redis:
        condition: service_healthy

  gateaway:
    build:
      context: .
      args:
        SERVICE_PATH: gateaway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEAWAY_PORT: ${GATEAWAY_PORT:-3000}
      AUTH_SERVICE_URL: http://auth:${AUTH_SERVICE_PORT:-3001}
      CHAT_SERVICE_URL: http://chat:${CHAT_SERVICE_PORT:-3002}
      AGENT_SERVICE_URL: http://agent:${AGENT_SERVICE_PORT:-3003}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      REDIS_URL: redis://redis:6379
    ports:
      - "${GATEAWAY_HOST_PORT:-3000}:${GATEAWAY_PORT:-3000}"
    depends_on:
      - auth
      - chat
      - agent

volumes:
  mongodb-data:
  redis-data:
